<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Position viewer</title>
  <link rel="stylesheet" href="/position.css" />
  <header>
    <h1>Position viewer</h1>
    <select id="pos" aria-label="Position"></select>
    <span class="spacer"></span>
    <small>Review edits are temporary</small>
    <label>
      <input id="review" type="checkbox" checked />
      Review
    </label>
  </header>
  <section class="toolbar">
    <div id="channels"></div>
    <fieldset id="layers">
      <legend>Overlays</legend>
      <label>
        <input type="checkbox" id="master" checked />
        Show
      </label>
      <label>
        <input type="checkbox" id="outlines" checked />
        Outlines
      </label>
      <label class="compact-slider" title="Outline stroke width in screen pixels (saved across positions)">
        Line
        <input type="range" id="lineWidth" min="0.5" max="4.5" step="0.25" value="2" />
        <span id="lineWidthVal">2.0</span>
      </label>
      <label>
        <input type="checkbox" id="ids" checked />
        IDs
      </label>
      <label class="compact-slider" title="Founder ID label font size in screen pixels (saved across positions)">
        Size
        <input type="range" id="labelSize" min="8" max="24" step="1" value="12" />
        <span id="labelSizeVal">12</span>
      </label>
      <label>
        Colour
        <select id="colourby" title="Outline colour: one colour per founder, or by the founder's fate">
          <option value="founder">by founder</option>
          <option value="fate">by fate</option>
        </select>
      </label>
      <span id="fatekey" hidden></span>
      <label>
        <input type="checkbox" id="events" checked />
        Events
      </label>
      <label>
        <input type="checkbox" id="mask" />
        Colony mask
      </label>
    </fieldset>
  </section>
  <main>
    <section class="pane">
      <h2>
        Whole position
        <span id="dimensions"></span>
      </h2>
      <div class="stage">
        <div id="overview" class="field">
          <canvas></canvas>
          <svg></svg>
        </div>
      </div>
    </section>
    <section class="pane">
      <h2>
        Zoom
        <span id="scale"></span>
        <span id="zooms"></span>
        <label id="smoothing" title="Interpolate enlarged pixels (like ImageJ's 'Interpolate zoomed images'). Display only: hover values stay raw.">
          <input type="checkbox" id="smooth" />
          Smooth
        </label>
      </h2>
      <div class="stage">
        <div id="zoom" class="field">
          <canvas></canvas>
          <svg></svg>
        </div>
      </div>
    </section>
    <aside>
      <h2>
        Position events
        <span id="count"></span>
      </h2>
      <div class="filters">
        <select id="type" aria-label="Event type">
          <option>All types</option>
          <option>division</option>
          <option>probably dead (PI)</option>
          <option>loss</option>
          <option>exclusion</option>
        </select>
        <select id="checked" aria-label="Review filter">
          <option>All reviews</option>
          <option>reviewed</option>
          <option>unreviewed</option>
        </select>
      </div>
      <div id="list"></div>
      <div id="card"></div>
    </aside>
  </main>
  <section class="timeline">
    <button id="play">Play</button>
    <button id="prev" aria-label="Previous frame">◀</button>
    <button id="next" aria-label="Next frame">▶</button>
    <label>
      <input type="number" id="fps" value="5" min="1" max="30" />
      fps
    </label>
    <div class="track">
      <input
        id="frame"
        aria-label="Timeline frame"
        type="range"
        min="0"
        max="155"
        value="0"
      />
      <svg id="ticks" viewBox="0 0 156 10" preserveAspectRatio="none"></svg>
    </div>
    <output id="time"></output>
    <label id="stoplabel">
      Stop at
      <select id="stop">
        <option>none</option>
        <option>every event</option>
        <option>unreviewed events</option>
      </select>
    </label>
  </section>
  <footer>
    <div id="status" aria-live="off">Loading position…</div>
    <div id="transform"></div>
  </footer>
  <section id="bc" hidden>
    <h2>
      <b id="bcname"></b>
      <button id="close" aria-label="Close brightness and contrast">×</button>
    </h2>
    <div class="bc-hint">Drag Min / Max handles directly on histogram (or drag shaded band to shift). Settings persist across positions.</div>
    <canvas id="hist" width="340" height="156"></canvas>
    <div id="ranges"></div>
    <div class="actions">
      <button id="auto">Auto</button>
      <button id="reset">Reset</button>
      <button id="set">Set</button>
      <span id="bclock" class="bc-lock"></span>
    </div>
    <label>
      <input id="perframe" type="checkbox" />
      Auto every frame
    </label>
  </section>
  <script src="/position.js" defer></script>
</html>
