[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-microscopy"
version = "0.1.0"
description = "Local, reviewable founder microscopy analysis with replaceable algorithms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "tifffile>=2023.7", "Pillow>=9", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lab-microscopy = "microscopy.cli:main"

[tool.setuptools.packages.find]
include = ["microscopy*"]

[tool.setuptools.package-data]
microscopy = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["microscopy/tests", "plate_reader/tests"]
